[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

; LittleFS holds results that could not be uploaded yet
board_build.filesystem = littlefs

lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    duinowitchery/hd44780
